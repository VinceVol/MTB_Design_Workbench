<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Icon Background -->
  <rect width="64" height="64" rx="8" fill="#1e293b" />

  <!-- Trajectory / Guide Curves (Red top, Green bottom - standard FreeCAD Workbench style) -->
  <path d="M 6 18 Q 32 6, 58 18" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
  <path d="M 6 48 Q 32 58, 58 48" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />

  <!-- Mountain Bike Frame & Line Art -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Wheels -->
    <circle cx="16" cy="38" r="8.5" stroke="#38bdf8" stroke-width="2" />
    <circle cx="48" cy="38" r="8.5" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Axle / Hub Dots -->
    <circle cx="16" cy="38" r="1.5" fill="#38bdf8" stroke="none" />
    <circle cx="48" cy="38" r="1.5" fill="#38bdf8" stroke="none" />

    <!-- Front Suspension Fork -->
    <line x1="48" y1="38" x2="40" y2="21" stroke="#f59e0b" stroke-width="2.5" />
    
    <!-- Handlebar & Stem -->
    <path d="M 37,18 L 41,21 L 43,20" stroke="#cbd5e1" stroke-width="2" />

    <!-- Frame Geometry (Full Suspension Main Triangle) -->
    <path d="M 40,23 L 28,26 L 25,37 L 35,37 Z" stroke="#38bdf8" stroke-width="2" />

    <!-- Rear Triangle / Swingarm -->
    <path d="M 25,37 L 16,38 L 28,26" stroke="#38bdf8" stroke-width="2" />

    <!-- Rear Shock Absorber Unit -->
    <line x1="28" y1="26" x2="33" y2="33" stroke="#ef4444" stroke-width="2" />
    <circle cx="30.5" cy="29.5" r="1" fill="#ef4444" stroke="none" />

    <!-- Bottom Bracket / Chainring Dot -->
    <circle cx="25" cy="37" r="2.5" stroke="#cbd5e1" stroke-width="1.5" />
  </g>
</svg>